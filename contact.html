<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
   <link rel="icon" href="https://cdtc.in/assets/Logo/logo.png" type="image/png">
    <link rel="shortcut icon" href="https://cdtc.in/assets/Logo/logo.ico" type="image/x-icon" >
  <title> CDTC Official </title>

  <!-- ======= Google Font =======-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
  <!-- End Google Font-->

  <!-- ======= Styles =======-->
  <link href="assets/vendors/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendors/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/vendors/glightbox/glightbox.min.css" rel="stylesheet">
  <link href="assets/vendors/swiper/swiper-bundle.min.css" rel="stylesheet">
  <link href="assets/vendors/aos/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- End Styles-->

  <!-- ======= Theme Style =======-->
  <link href="assets/css/style.css" rel="stylesheet">
  <!-- End Theme Style-->



  <!-- ======= Apply theme =======-->
  <script>
    // Apply the theme as early as possible to avoid flicker
    (function () {
      const storedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-bs-theme', storedTheme);
    })();
  </script>
</head>

<body>


  <!-- ======= Site Wrap =======-->
  <div class="site-wrap">


      <div id="header-placeholder"></div>

        <!-- ======= Main =======-->
        <main>

    <!-- ======= Contact Section with Background Video =======-->
    <section class="pt-5 position-relative" style="min-height: 600px; overflow: hidden;">
        <div class="container py-8" style="position: relative; z-index: 2;">
            <div class="contact-container "
                style="background-color: rgba(255,255,255,0.85); max-width: 600px; margin: auto; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.3);">
                <h2 style="text-align:center; margin-top: 0; font-size:34px; font-weight:800; color:#003399;">Contact Us</h2>
                <form id="contactForm" method="POST">
                    <label for="name">Name<span class="text-danger">*</span></label>
                    <input class="form-control" type="text" id="name" name="name" required>
    
                    <label for="email">Email<span class="text-danger">*</span></label>
                    <input class="form-control" type="email" id="email" name="email" required>
    
                    <label for="subject">Subject<span class="text-danger">*</span></label>
                    <input class="form-control" type="text" id="subject" name="subject" required>
    
                    <label for="message">Message<span class="text-danger">*</span></label>
                    <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
    
                <button  type="submit" id="submitBtn">
                    <span id="spinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                    Send Message
                </button>

                </form>
                <div class="mt-3 d-none alert alert-success" id="successMessage">Message sent successfully!</div>
                <div class="mt-3 d-none alert alert-danger" id="errorMessage">Message sending failed. Please try again
                    later.</div>
            </div>
        </div>
    </section>
        
        <style>
            
            .contact-container {
                background-color: white;
                max-width: 600px;
                margin: auto;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
        
            .contact-container h2 {
                text-align: center;
                margin-bottom: 25px;
            }
        
            .contact-container label {
                display: block;
                margin-top: 15px;
                font-weight: bold;
            }
        
            .contact-container input,
            .contact-container textarea {
                width: 100%;
                padding: 10px;
                margin-top: 5px;
                border-radius: 5px;
                border: 1px solid #ccc;
            }
        
            .contact-container button {
                margin-top: 20px;
                background-color: #03056d;
                color: white;
                padding: 12px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                width: 100%;
            }
        
            .contact-container button:hover {
                background-color: #3119b6;
            }
        </style>
        <!-- ======= End Contact Section =======-->

         

<div id="footer-placeholder"></div>

</main>

    <!-- Server side to load header section -->
     <script >

  
    fetch('header.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('header-placeholder').innerHTML = html;
        })
        .catch(err => console.warn('Failed to load header:', err));
    </script>

    <!-- Server side to load footer section -->
    <script>
        fetch('footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                // Now set the year dynamically
                document.getElementById('current-year').textContent = new Date().getFullYear();
            })
            .catch(err => console.error('Failed to load footer:', err));
    </script>

    <!-- disable Inspect Element -->
<script
    disable-select = "true"
    disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool'>
</script>

        </main>
    </div>

    <!-- ======= Back to Top =======-->
    <button id="back-to-top"><i class="bi bi-arrow-up-short"></i></button>
    <!-- End Back to top-->

    <!-- ======= Javascripts =======-->
    <script src="assets/vendors/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="assets/vendors/gsap/gsap.min.js"></script>
    <script src="assets/vendors/imagesloaded/imagesloaded.pkgd.min.js"></script>
    <script src="assets/vendors/isotope/isotope.pkgd.min.js"></script>
    <script src="assets/vendors/glightbox/glightbox.min.js"></script>
    <script src="assets/vendors/swiper/swiper-bundle.min.js"></script>
    <script src="assets/vendors/aos/aos.js"></script>
    <script src="assets/vendors/purecounter/purecounter.js"></script>
    <script src="assets/js/custom.js"></script>
    <script src="./assets/js/contactEmail.js"></script>
    <!-- End JavaScripts-->
</body>

</html>
